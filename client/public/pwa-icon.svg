<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1F2C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4" />

  <!-- Central High-Tech NexStay Glyph -->
  <g filter="url(#glow)">
    <!-- Stylized 'N' & Key Shape -->
    <path d="M160 140 L160 372 M160 140 L352 372 M352 140 L352 372" 
          stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Cyberpunk Core Sparkle -->
    <circle cx="256" cy="256" r="18" fill="#00F3FF" />
  </g>
</svg>
